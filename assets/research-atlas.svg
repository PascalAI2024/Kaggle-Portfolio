<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Kaggle Field Notes research atlas</title>
  <desc id="desc">A diagram of the portfolio method: evidence feeds experiment, experiment feeds systems, systems produce public proof. Boundary and retrospective sit alongside the chain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152b"/><stop offset="1" stop-color="#172554"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <g opacity=".1" stroke="#93c5fd">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/>
    <path d="M120 0V420M360 0V420M600 0V420M840 0V420M1080 0V420"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="60" y="64" fill="#e0f2fe" font-size="19" letter-spacing="4">KAGGLE / FIELD NOTES</text>
    <text x="60" y="92" fill="#94a3b8" font-size="12" letter-spacing="2">PUBLIC RESEARCH ATLAS · EDITION 01</text>
  </g>

  <!-- chain -->
  <path d="M110 240H350" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M370 240H630" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M650 240H910" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <circle cx="110" cy="240" r="10" fill="#38bdf8"/>
    <text x="110" y="188" fill="#dbeafe" font-size="15" letter-spacing="1">EVIDENCE</text>
    <text x="110" y="210" fill="#94a3b8" font-size="12">source · date</text>

    <circle cx="360" cy="240" r="10" fill="#38bdf8"/>
    <text x="360" y="188" fill="#dbeafe" font-size="15" letter-spacing="1">EXPERIMENT</text>
    <text x="360" y="210" fill="#94a3b8" font-size="12">baseline · hypothesis</text>

    <circle cx="640" cy="240" r="10" fill="#38bdf8"/>
    <text x="640" y="188" fill="#dbeafe" font-size="15" letter-spacing="1">SYSTEMS</text>
    <text x="640" y="210" fill="#94a3b8" font-size="12">compute · readiness</text>

    <circle cx="920" cy="240" r="10" fill="#67e8f9"/>
    <text x="920" y="188" fill="#dbeafe" font-size="15" letter-spacing="1">PUBLIC PROOF</text>
    <text x="920" y="210" fill="#94a3b8" font-size="12">verified only</text>
  </g>

  <!-- side stations -->
  <path d="M360 252C360 286 350 296 330 306" stroke="#c084fc" stroke-width="2" stroke-dasharray="7 8" fill="none"/>
  <path d="M640 252C640 292 630 306 610 318" stroke="#67e8f9" stroke-width="2" stroke-dasharray="4 8" fill="none"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <circle cx="330" cy="310" r="8" fill="#c084fc"/>
    <text x="352" y="306" fill="#e9d5ff" font-size="14" letter-spacing="1">BOUNDARY</text>
    <text x="352" y="326" fill="#94a3b8" font-size="12">private · active · rule-bound</text>

    <circle cx="610" cy="324" r="8" fill="#67e8f9"/>
    <text x="632" y="320" fill="#dbeafe" font-size="14" letter-spacing="1">RETROSPECTIVE</text>
    <text x="632" y="340" fill="#94a3b8" font-size="12">lesson · context · receipt</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">
    <text x="60" y="390" fill="#64748b">EDITION 01 · NOVEMBER 2026</text>
    <text x="1140" y="390" fill="#64748b" text-anchor="end">READ LEFT TO RIGHT</text>
  </g>
</svg>
