<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Kaggle Field Notes research atlas</title>
  <desc id="desc">An editorial map connecting evidence, experiments, systems, and public proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152b"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <g opacity=".14" stroke="#93c5fd"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/><path d="M100 0V420M250 0V420M400 0V420M550 0V420M700 0V420M850 0V420M1000 0V420M1150 0V420"/></g>
  <text x="60" y="76" fill="#e0f2fe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="4">KAGGLE / FIELD NOTES</text>
  <text x="60" y="118" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2">PUBLIC RESEARCH ATLAS · EDITION 01</text>
  <g fill="none" stroke-linecap="round">
    <path d="M276 250 C390 250 430 220 525 210 S700 177 780 160 S890 130 974 150" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/>
    <path d="M525 210 C590 278 700 304 790 282 S900 260 974 278" stroke="#c084fc" stroke-width="3" stroke-dasharray="9 10"/>
    <path d="M780 160 C790 245 840 305 974 330" stroke="#67e8f9" stroke-width="2" stroke-dasharray="4 9"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(75 205)"><circle cx="0" cy="0" r="13" fill="#38bdf8"/><text x="25" y="5" fill="#dbeafe" font-size="17">EVIDENCE</text><text x="25" y="31" fill="#94a3b8" font-size="13">source · date · permission</text></g>
    <g transform="translate(500 210)"><circle cx="0" cy="0" r="13" fill="#38bdf8"/><text x="25" y="5" fill="#dbeafe" font-size="17">EXPERIMENT</text><text x="25" y="31" fill="#94a3b8" font-size="13">baseline · hypothesis · audit</text></g>
    <g transform="translate(755 142)"><circle cx="0" cy="0" r="13" fill="#38bdf8"/><text x="25" y="5" fill="#dbeafe" font-size="17">SYSTEMS</text><text x="25" y="31" fill="#94a3b8" font-size="13">compute · readiness · repeatability</text></g>
    <g transform="translate(950 145)"><circle cx="0" cy="0" r="13" fill="#67e8f9"/><text x="25" y="5" fill="#dbeafe" font-size="17">PUBLIC PROOF</text><text x="25" y="31" fill="#94a3b8" font-size="13">only what can be checked</text></g>
    <g transform="translate(950 278)"><circle cx="0" cy="0" r="13" fill="#c084fc"/><text x="25" y="5" fill="#e9d5ff" font-size="17">BOUNDARY</text><text x="25" y="31" fill="#94a3b8" font-size="13">private, active, or rule-bound</text></g>
    <g transform="translate(950 330)"><circle cx="0" cy="0" r="13" fill="#67e8f9"/><text x="25" y="5" fill="#dbeafe" font-size="17">RETROSPECTIVE</text><text x="25" y="31" fill="#94a3b8" font-size="13">lesson · context · receipt</text></g>
  </g>
  <text x="60" y="375" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">THE METHOD IS THE PORTFOLIO.</text>
</svg>
